services:

  app:
    build: .
      - ports: 8080:80       
    depends_on: db
    environment:
      DATABASE_URL: ???

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    volumes:
       - db_data:/var/lib/postgresql/data

volumes:
  db_data:
